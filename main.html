<body>
    <h1 class="sr-only">D&amp;D 5e Character Manager</h1>

    <!-- <button class="btn btn-primary" id="add">Add</button> -->




    <main>

        <div id="name-container" class="flex items-start pt-4 pb-4 ">

                    <span class="text-xs text-gray-500 uppercase">Class &amp; Level</span>

                    <input
                        type="text"
                        aria-label="Race"

                        placeholder=""
                    >
                    <span class="text-xs text-gray-500 uppercase">Race</span>

                </div>

                <div class="w-1/3 flex flex-col space-y-1 pr-2">
                    <input
                        type="text"
                        aria-label="Background"
                        class="w-full px-3 py-2 mb-0 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder=""
                    >
                    <span class="text-xs text-gray-500 uppercase">Background</span>

                    <input
                        type="text"
                        aria-label="Alignment"
                        class="w-full px-3 py-2 mb-0 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder=""
                    >
                    <span class="text-xs text-gray-500 uppercase">Alignment</span>

                </div>

                <div class="w-1/3 flex flex-col space-y-1 pr-2">
                    <input
                        type="text"
                        aria-label="Player Name"
                        class="w-full px-3 py-2 mb-0 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder=""
                    >
                    <span class="text-xs text-gray-500 uppercase">Player Name</span>

                    <input
                        type="text"
                        aria-label="XP"
                        class="w-full px-3 py-2 mb-0 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder=""
                    >
                    <span class="text-xs text-gray-500 uppercase">XP</span>

                </div>

            </div>

        </div>

        <div class="max-w-md mx-auto space-y-6 mb-4">
            <div>
                <label for="selectedClasses" class="block font-medium mb-2">Class</label>
                <select id="selectedClasses" class="w-full border rounded p-2">
                </select>
            </div>

            <div>
                <label for="selectedSubclasses" class="block font-medium mb-2">Subclass</label>
                <select id="selectedSubclasses" class="w-full border rounded p-2">
                </select>
            </div>
        </div>

        <div id="listWithHandle" class="p-12 max-w-4xl mx-auto">

            <div class="max-w-md mx-auto mt-10 pb-8">
                <div class="flex items-center gap-2">
                    <input
                        type="text"
                        id="searchInput"
                        aria-label="Search equipment"
                        class="p-2 flex-1 border border-gray-300 rounded-md
                        focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Search..."
                    >
                    <button id="undoDelete" type="button" disabled
                        class="border border-gray-300 rounded px-3 py-1.5 text-sm
                        hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer
                        whitespace-nowrap">
                        Undo
                    </button>
                </div>
                <div
                    id="equipmentList"
                    class=" mt-2 border border-gray-300 rounded-lg bg-white max-h-48 overflow-auto"
                >



                </div>
            </div>


        </div>

    </main>

    <script>

        function postEquipmentResults(equipmentResults) {
            console.log(equipmentResults);

            var equipmentResultsDiv = document.getElementById("equipmentList");
        }

        var UNDO_LIMIT = 5;
        var deletedStack = []; // [{ row, count, nextSibling }], LIFO

        function getRowCount(row) {
            try {
                if (row && window.Alpine && Alpine.$data(row)) {
                    var data = Alpine.$data(row);
                    if (typeof data.count === "number") {
                        return data.count;
                    }
                }
            } catch (err) {
                console.warn("getRowCount: could not read count", err);
            }
            console.warn("getRowCount: count unavailable, defaulting to 1", row);
            return 1; // matches x-data="{ count: 1 }" initial value
        }

        function removeInventoryItem(button) {
            var row = button.closest(".inventory-item");
            if (!row) {
                console.warn("removeInventoryItem: no .inventory-item ancestor found", button);
                return;
            }
            var nextSibling = row.nextElementSibling;
            deletedStack.push({ row: row, count: getRowCount(row), nextSibling: nextSibling });
            if (deletedStack.length > UNDO_LIMIT) {
                deletedStack.shift();
            }
            row.remove();
            updateUndoButton();
        }

        function updateUndoButton() {
            var btn = document.getElementById("undoDelete");
            if (!btn) return;
            btn.disabled = deletedStack.length === 0;
        }

        function undoDelete() {
            if (deletedStack.length === 0) return;
            var entry = deletedStack.pop();
            var restoredRow = entry.row;
            restoredRow.setAttribute("x-data", JSON.stringify({ count: entry.count }));
            var list = document.getElementById("listWithHandle");
            if (entry.nextSibling && entry.nextSibling.parentNode === list) {
                list.insertBefore(restoredRow, entry.nextSibling);
            } else {
                // Row was last when deleted, or its saved sibling was itself
                // deleted since. Append at the end; order among surviving rows
                // is always preserved.
                list.appendChild(restoredRow);
            }
            updateUndoButton();
        }

        function attachDeleteListener() {
            document.getElementById("listWithHandle").addEventListener("click", function (e) {
                var undoBtn = e.target.closest("#undoDelete");
                if (undoBtn) {
                    undoDelete();
                    return;
                }
                var delBtn = e.target.closest('[aria-label="Remove item"]');
                if (delBtn) removeInventoryItem(delBtn);
            });
        }
        attachDeleteListener();
        updateUndoButton();

        function addItemToInventory(item) {
            const container = item.parentElement; // KEPT dead code

            // Build the row fully detached, with x-data set BEFORE attach so
            // Alpine initializes it in one well-defined step (no reliance on
            // attribute-mutation + childList ordering on a live node).
            var row = document.createElement("div");
            row.className = "inventory-item";
            row.setAttribute("x-data", "{ count: 1 }");

            var nameSpan = document.createElement("span");
            nameSpan.className = "item-name";
            nameSpan.textContent = item.textContent.trim();
            row.appendChild(nameSpan);

            var firstDivElement = document.createElement("div"); // KEPT dead code
            firstDivElement.className = "";

            var controls = document.createElement("div");
            controls.className = "flex items-center gap-2 mt-1";

            var dragHandle = document.createElement("span");
            dragHandle.className = "move cursor-grab text-gray-400 select-none";
            dragHandle.textContent = "⋮⋮";
            dragHandle.setAttribute("title", "Drag to reorder");
            dragHandle.setAttribute("aria-hidden", "true");
            controls.appendChild(dragHandle);

            var plusButton = document.createElement("button");
            plusButton.setAttribute("x-on:click", "count++");
            plusButton.textContent = " + ";
            plusButton.className = "border border-gray-400 rounded px-3 py-1.5 hover:bg-blue-100 text-lg cursor-pointer";
            plusButton.type = "button";

            var minusButton = document.createElement("button");
            minusButton.setAttribute("x-on:click", "if (count > 0) count--");
            minusButton.textContent = " - ";
            minusButton.className = "border border-gray-400 rounded px-3 py-1.5 hover:bg-blue-100 text-lg cursor-pointer";
            minusButton.type = "button";

            var deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.textContent = "×";
            deleteButton.setAttribute("aria-label", "Remove item");
            deleteButton.className = "border border-red-400 text-red-600 rounded px-2 py-1 hover:bg-red-100 text-lg cursor-pointer leading-none";

            var counterSpan = document.createElement("span");
            counterSpan.setAttribute("x-text", "count");
            counterSpan.className = "text-xl pl-1 tabular-nums";

            controls.appendChild(deleteButton);
            controls.appendChild(plusButton);
            controls.appendChild(minusButton);
            controls.appendChild(counterSpan);

            row.appendChild(controls);

            document.getElementById("listWithHandle").appendChild(row);

            // Remove the source search result so "add" keeps its move semantics
            // (the result leaves the list) while the inventory row is a clean,
            // valid <div> rather than a moved <li>.
            item.remove();
        }

        async function getJsonData(url, name) {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            const data = await response.json();
            localStorage.setItem(name, JSON.stringify(data));
        }

        async function getJsonData(url, name) {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            const data = await response.json();
            localStorage.setItem(name, JSON.stringify(data));
        }

        function tooltip (element) {

            // console.log("hey")

            // Popper.createPopper(this, tooltip, {
            //     placement: 'right',
            // });
        }

        const options = {
            includeScore: true,
            keys: ['name'],
            threshold: 0.3,
            shouldSort: true,
            isCaseSensitive: false,
            ignoreLocation: true,
            minMatchCharLength: 1,      // allow small substrings
        };

        async function startup () {

            const itemsBaseJsonUrl = "https://raw.githubusercontent.com/5etools-mirror-3/5etools-2014-src/refs/heads/main/data/items.json"
            const classesLookupJsonUrl = "https://raw.githubusercontent.com/5etools-mirror-3/5etools-2014-src/refs/heads/main/data/generated/gendata-subclass-lookup.json"


            if (!localStorage.getItem("equipmentJson")) {
                try {
                    await getJsonData(itemsBaseJsonUrl, 'equipmentJson');
                } catch (error) {
                    console.error('Failed to fetch equipment data:', error);
                }
            }

            if (!localStorage.getItem("classesLookupJson")) {
                try {
                    await getJsonData(classesLookupJsonUrl, 'classesLookupJson');
                } catch (error) {
                    console.error('Failed to fetch classes lookup data:', error);
                }
            }

            // KEPT dead code: classesLookupJson parse (now guarded against corrupt cache)
            let classesLookupJson = {};
            try {
                classesLookupJson = JSON.parse(localStorage.getItem("classesLookupJson")) ?? {};
            } catch (error) {
                console.error('Corrupt classesLookupJson cache:', error);
            }

            let equipmentItems = [];
            try {
                const equipmentJson = JSON.parse(localStorage.getItem("equipmentJson"));
                if (equipmentJson && Array.isArray(equipmentJson.item)) {
                    equipmentItems = equipmentJson.item;
                }
            } catch (error) {
                console.error('Corrupt equipmentJson cache, clearing:', error);
                localStorage.removeItem("equipmentJson");
            }

            const fuse = new Fuse(equipmentItems, options);

            const equipmentSearchInput = document.getElementById('searchInput');
            const equipmentResultsDiv = document.getElementById('equipmentList');

            if (equipmentItems.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'p-2 text-sm text-gray-500';
                emptyMsg.textContent = 'No equipment data loaded. Check your connection and reload the page.';
                equipmentResultsDiv.replaceChildren(emptyMsg);
            }


            equipmentSearchInput.addEventListener('input', () => {
                const query = equipmentSearchInput.value;

                const ul = document.createElement('ul');
                ul.className = 'pl-5 space-y-3 text-gray-700 list-disc marker:text-blue-500 max-w-md mx-auto';

                if (!query.trim()) {
                    equipmentResultsDiv.replaceChildren(ul);
                    return;
                }

                const filtered = fuse.search(query).slice(0, 100);

                filtered.forEach(result => {
                    const item = result.item;
                    const li = document.createElement('li');
                    li.className = 'p-2 rounded hover:bg-blue-100 cursor-pointer';

                    li.textContent = item.name;
                    const sourceSpan = document.createElement('span');
                    sourceSpan.className = 'text-gray-500 text-xs';
                    sourceSpan.textContent = ' (' + item.source + ') ';
                    li.appendChild(sourceSpan);

                    ul.appendChild(li);
                });

                equipmentResultsDiv.replaceChildren(ul);
            });

            equipmentResultsDiv.addEventListener('click', (e) => {
                const li = e.target.closest('li');
                if (li && equipmentResultsDiv.contains(li)) {
                    addItemToInventory(li);
                }
            });
        }


        const classes = [
            "Artificer (TCE)", "Barbarian (PHB)",
            "Bard (PHB)", "Cleric (PHB)",
            "Druid (PHB)", "Fighter (PHB)",
            "Monk (PHB)", "Paladin (PHB)",
            "Ranger (PHB)", "Rogue (PHB)",
            "Sorcerer (PHB)", "Warlock (PHB)",
            "Wizard (PHB)"
        ];

        const select = document.getElementById('selectedClasses');

        classes.forEach(cls => {
            const option = document.createElement('option');
            option.value = cls;
            option.textContent = cls;
            select.appendChild(option);
        });


        Sortable.create(document.getElementById("listWithHandle"), {
            handle: '.move',
            draggable: '.inventory-item',
            animation: 150
        });

        startup().catch(function (error) {
            console.error('startup failed:', error);
        });




    </script>

</body>
