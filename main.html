        function addItemToInventory(item) {
            console.log("clicked")

            const container = item.parentElement;

            const liElement = item;
            liElement.setAttribute("x-data", "{ count: 1 }");
            liElement.removeAttribute("onclick");
            // const hiddenItems = Array.from(container.querySelectorAll('p')).filter(p => 
            //     window.getComputedStyle(p).display === 'none'
            // );

            // properties = [];
            // properties.push(item.textContent.trim());

            console.log(liElement);

            var outerDivElement = document.createElement("div");
            outerDivElement.classList = ""
            // var span = document.createElement("span");

            var firstDivElement = document.createElement("div");
            firstDivElement.classList = "";

            var secondDivElement = document.createElement("div");
            secondDivElement.classList = "w-[30%]";

            var plusButton = document.createElement("button");
            plusButton.setAttribute("x-on:click", "count++");
            plusButton.textContent = " + ";
            plusButton.classList = "border border-gray-400 rounded px-3 py-1.5 ml-1 hover:bg-blue-100 text-lg cursor-pointer";

            var minusButton = document.createElement("button");
            minusButton.setAttribute("x-on:click", "if (count > 0) count--");
            minusButton.textContent = " - ";
            minusButton.classList = "border border-gray-400 rounded px-3 py-1.5 ml-1 hover:bg-blue-100 text-lg cursor-pointer";

            var counterSpan = document.createElement("span");
            counterSpan.setAttribute("x-text:", "count");
            counterSpan.textContent = 0;
            counterSpan.classList = "text-xl pl-1"
                        
            secondDivElement.appendChild(plusButton);
            secondDivElement.appendChild(minusButton);
            secondDivElement.appendChild(counterSpan);

            liElement.appendChild(secondDivElement);
            
            outerDivElement.appendChild(liElement);

  
            
            var list = document.getElementById("listWithHandle");
            list.appendChild(outerDivElement);
        }

        async function getJsonData(url, name) {

            try {
                const response = await fetch(url);
                if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
                }
                    const data = await response.json();
                    localStorage.setItem(name, JSON.stringify(data));
                    console.log(`Stored ${name} in localStorage.`);
            } catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
        }

        async function startup () {

            const itemsBaseJsonUrl = "https://raw.githubusercontent.com/5etools-mirror-3/5etools-2014-src/refs/heads/main/data/items.json"
            const classesLookupJsonUrl = "https://raw.githubusercontent.com/5etools-mirror-3/5etools-2014-src/refs/heads/main/data/generated/gendata-subclass-lookup.json"


            if (!localStorage.getItem("equipmentJson")) {

                // (async () => {   
                    await getJsonData(itemsBaseJsonUrl, 'equipmentJson');
                // })();                

            } else {
                console.log("equipmentJson already in local storage");
            };

            if (!localStorage.getItem("classesLookupJson")) {

                // (async () => {
                    await getJsonData(classesLookupJsonUrl, 'classesLookupJson');
                // })();                

            } else {
                console.log("classesLookupJson already in local storage");
            };

            const classesLookupJson = JSON.parse(localStorage.getItem("classesLookupJson"));
            const equipmentJson = JSON.parse(localStorage.getItem("equipmentJson"));

            const fuse = new Fuse(equipmentJson.item, options);
            
            const equipmentSearchInput = document.getElementById('searchInput');
            const equipmentResultsDiv = document.getElementById('equipmentList');


            equipmentSearchInput.addEventListener('input', () => {
                const query = equipmentSearchInput.value;
                equipmentResultsDiv.innerHTML = '';

                // if (query) {
                    // console.log(query);
                // };

                var filtered = JSON.stringify(fuse.search(query));
                filtered = JSON.parse(filtered);
                console.log(filtered);

                html = filtered.map(item => `
                    <li 
                        onmouseover="tooltip(this)"
                        class="p-2 rounded hover:bg-blue-100 cursor-pointer" 
                        onclick=addItemToInventory(this) 
                        basicRules="${item.item.basicRules}" 
                        source="${item.source}" 
                        description=${item.entries}
                        page="${item.page}" 
                        rarity="${item.rarity}" 
                        srd="${item.srd}" 
                        type="${item.type}" 
                        value="${item.value}" 
                        weight="${item.weight}" 
                        miscTags="${item.miscTags}">
                        ${item.item.name}
                        <span class="text-gray-500 text-xs">(${item.item.source}) </span>
                    </li>

                `).join('');
                equipmentResultsDiv.innerHTML = '';
                equipmentResultsDiv.innerHTML += `
                    <ul id="styledList" class="pl-5 space-y-3 text-gray-700 list-disc marker:text-blue-500 max-w-md mx-auto">
                `
                equipmentResultsDiv.innerHTML += html;
                equipmentResultsDiv.innerHTML += `
                    </ul>
                `;
            });
        }

        async function listInit () {

        }
        
        // const baseUrl = "https://raw.githubusercontent.com/";
        // const pathUrl = "5etools-mirror-3/5etools-2014-src/refs/heads/main/data/";

        const classes = [
            "Artificer (TCE)", "Barbarian (PHB)",
            "Bard (PHB)", "Cleric (PHB)",
            "Druid (PHB)", "Fighter (PHB)",
            "Monk (PHB)", "Paladin (PHB)",
            "Ranger (PHB)", "Rogue (PHB)",
            "Sorcerer (PHB)", "Warlock (PHB)",
            "Wizard (PHB)"
        ];

        const select = document.getElementById('selectedClasses');

        classes.forEach(cls => {
            const option = document.createElement('option');
            option.value = cls;
            option.textContent = cls;
            select.appendChild(option);
        });


        const options = {
            includeScore: true,
            keys: ['name'],
            threshold: 0.3,
            shouldSort: true,
            isCaseSensitive: false,
            ignoreLocation: true,
            minMatchCharLength: 1,      // allow small substrings
        };

        Sortable.create(listWithHandle, {
            handle: '.move',
            animation: 150
        });

        startup();
